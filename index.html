<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#4facfe,#00f2fe);

}

.container{

    text-align:center;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.3);

}

h1{

    margin-bottom:20px;
    color:#333;

}

.board{

    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:8px;
    justify-content:center;

}

.cell{

    background:#f5f5f5;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}

.cell:hover{

    background:#d9f2ff;

}

#status{

    margin:20px 0;
    font-size:22px;
    color:#444;

}

button{

    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#4CAF50;

}

@media(max-width:450px){

.board{

grid-template-columns:repeat(3,80px);
grid-template-rows:repeat(3,80px);

}

.cell{

font-size:35px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>Tic Tac Toe</h1>

<div class="board">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>

<p id="status">Player X's Turn</p>

<button onclick="restartGame()">
Restart Game
</button>

</div>

<script>

const cells=document.querySelectorAll(".cell");

const status=document.getElementById("status");

let currentPlayer="X";

let gameActive=true;

let board=["","","","","","","","",""];

const winPatterns=[

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];

cells.forEach((cell,index)=>{

cell.addEventListener("click",()=>cellClicked(index));

});

function cellClicked(index){

if(board[index]!=="" || !gameActive){

return;

}

board[index]=currentPlayer;

cells[index].textContent=currentPlayer;

checkWinner();

}

function checkWinner(){

let won=false;

for(let pattern of winPatterns){

let a=board[pattern[0]];
let b=board[pattern[1]];
let c=board[pattern[2]];

if(a=="" || b=="" || c==""){

continue;

}

if(a===b && b===c){

won=true;

break;

}

}

if(won){

status.textContent="🎉 Player "+currentPlayer+" Wins!";

gameActive=false;

return;

}

if(!board.includes("")){

status.textContent="🤝 It's a Draw!";

gameActive=false;

return;

}

currentPlayer=currentPlayer==="X" ? "O" : "X";

status.textContent="Player "+currentPlayer+"'s Turn";

}

function restartGame(){

board=["","","","","","","","",""];

gameActive=true;

currentPlayer="X";

status.textContent="Player X's Turn";

cells.forEach(cell=>{

cell.textContent="";

});

}

</script>

</body>
</html>
